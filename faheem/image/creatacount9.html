<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div
    class="bg-gray-100 w-full max-w-5xl rounded-2xl flex flex-col lg:flex-row items-center gap-8 lg:gap-4 p-4 sm:p-8">

    <!-- Left Card: Form -->
    <div class="bg-white w-full max-w-md lg:max-w-none lg:w-1/2  shadow-sm p-6 sm:p-10">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">Sign up with us</h1>
      <p class="text-sm text-gray-500 mb-8">
        Already have an account?
        <a href="#" class="text-blue-600 font-medium hover:underline">Login</a>
      </p>

      <form class="space-y-5">
        <!-- Full Name -->
        <div>
          <label for="fullname" class="block text-sm text-gray-500 mb-1">Full Name</label>
          <input type="text" id="fullname" placeholder="Enter your full name"
            class="w-full border border-blue-400 rounded-lg px-4 py-3 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm text-gray-500 mb-1">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email address"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm text-gray-500 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="password" placeholder="Create your password"
              class="w-full border border-gray-200 rounded-lg px-4 py-3 pr-10 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg py-3 transition">
          Create Account
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3 py-1">
          <span class="flex-1 h-px bg-gray-200"></span>
          <span class="text-xs text-gray-400">Or</span>
          <span class="flex-1 h-px bg-gray-200"></span>
        </div>

        <!-- Social Buttons -->
        <div class="grid grid-cols-2 gap-4">
          <button type="button"
            class="flex items-center justify-center gap-2 border border-orange-400 rounded-lg py-3 text-sm font-medium text-gray-700 hover:bg-orange-50 transition">
            <svg class="h-5 w-5" viewBox="0 0 48 48">
              <path fill="#FFC107"
                d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" />
              <path fill="#FF3D00"
                d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" />
              <path fill="#4CAF50"
                d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" />
              <path fill="#1976D2"
                d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" />
            </svg>
            <span class="text-orange-500">Google</span>
          </button>

          <button type="button"
            class="flex items-center justify-center gap-2 border border-blue-400 rounded-lg py-3 text-sm font-medium text-blue-600 hover:bg-blue-50 transition">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M9.9645 23.2916H14.2978V14.6141H18.2022L18.6312 10.3024H14.2978V8.12492C14.2978 7.8376 14.412 7.56205 14.6151 7.35889C14.8183 7.15572 15.0939 7.04159 15.3812 7.04159H18.6312V2.70825H15.3812C13.9446 2.70825 12.5668 3.27893 11.551 4.29476C10.5352 5.31058 9.9645 6.68833 9.9645 8.12492V10.3024H7.79784L7.36884 14.6141H9.9645V23.2916Z"
                fill="#1877F2" />
            </svg>
            Facebook
          </button>
        </div>
      </form>
    </div>

    <!-- Right Side: Image Placeholder -->
    <div class="hidden lg:flex w-full lg:w-1/2 items-center justify-center min-h-[300px] lg:min-h-[600px]   ">
      <img src="/faheem/icon/carton.svg" alt="Sign Up Illustration"
        class="h-[95%] w-[95%] max-h-[790px] max-w-[660px] object-contain">
    </div>

  </div>

</body>

</html>
