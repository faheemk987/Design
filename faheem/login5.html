<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome back  Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
</style>
</head>
<body class="min-h-screen bg-[#fafafa] flex items-center justify-center p-4 sm:p-6 lg:p-10">

  <div class="w-full max-w-7xl rounded-3xl overflow-hidden grid lg:grid-cols-2 lg:h-[700px]">

    <!-- Left: form -->
    <div class="flex flex-col justify-center px-6 py-5 sm:px-10 md:px-14 lg:px-12 xl:px-16">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900">Welcome back!</h1>
      <p class="text-sm text-gray-500 mt-2">Login to access all your data</p>

      <form class="mt-6 space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-indigo-400 tracking-wide mb-1.5">Email Address</label>
          <input
            id="email"
            type="email"
            placeholder="Enter your email address"
            class="w-full rounded-lg border border-gray-200 px-4 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-indigo-400 tracking-wide mb-1.5">Password</label>
          <div class="relative">
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              class="w-full rounded-lg border border-gray-200 px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            />
            <button type="button" id="toggle-password" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg id="eye-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a21.62 21.62 0 015.06-6.06M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a21.6 21.6 0 01-3.22 4.6M1 1l22 22"/>
                <path d="M14.12 14.12a3 3 0 11-4.24-4.24"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-[#4b3fc9] hover:bg-[#3f34ab] text-white text-sm font-semibold py-2.5 rounded-full transition"
        >
          Create an account
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-4">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400">Continue with</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Social buttons -->
      <div class="space-y-3">
        <button class="w-full flex items-center justify-center gap-2 border border-gray-200 rounded-lg py-2.5 text-sm font-medium text-gray-800 hover:bg-gray-50 transition">
          Login with Google
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.6 5.6 0 01-2.4 3.68v3h3.86c2.26-2.09 3.56-5.17 3.56-8.92z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0012 24z"/>
            <path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 010-4.56v-3.1H1.29a12 12 0 000 10.76l3.98-3.1z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.29 6.62l3.98 3.1C6.22 6.86 8.87 4.75 12 4.75z"/>
          </svg>
        </button>

        <button class="w-full flex items-center justify-center gap-2 border border-gray-200 rounded-lg py-2.5 text-sm font-medium text-gray-800 hover:bg-gray-50 transition">
          Login with Facebook
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/>
          </svg>
        </button>
      </div>

      <p class="text-center text-sm text-gray-500 mt-4">
        Don't have an account? <a href="#" class="text-indigo-600 font-semibold underline">Register</a>
      </p>
    </div>

    <!-- Right: image -->
    <div class="hidden lg:block relative m-3 h-[calc(100%-1.5rem)] rounded-2xl overflow-hidden border-2 border-gray-300 bg-gray-50">
      <img src="/faheem/image/backgroundlogin5.svg" alt="Login visual" class="w-full h-full object-cover rounded-2xl" />

      <div class="w-full h-full flex flex-col items-center justify-center gap-2 text-gray-400">
        <svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5V6a1.5 1.5 0 011.5-1.5h15A1.5 1.5 0 0121 6v12a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18v-1.5zm0 0l5.25-5.25a1.5 1.5 0 012.12 0L15 16.5m-3-3l2.25-2.25a1.5 1.5 0 012.12 0L21 15.75" />
          <circle cx="8.25" cy="8.25" r="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="text-sm font-medium"># likho os ki jaga apni image</span>
      </div>
    </div>

  </div>

</body>
</html>
