<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesignMe Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen font-sans">

  <header class="w-full bg-white border-b border-gray-100 relative z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-2">
        <img src="./icon/logologin1.svg" alt="DesignMe logo" class="h-8 w-8 object-contain">
        <span class="font-semibold text-gray-900 text-base">DesignMe.</span>
      </div>

      <nav class="hidden lg:flex items-center gap-8 text-sm font-medium">
        <a href="#" class="text-gray-600 hover:text-green-800">Home</a>
        <a href="#" class="text-gray-600 hover:text-green-800">Vectors</a>
        <a href="#" class="text-gray-600 hover:text-green-800">Templates</a>
        <a href="#" class="text-gray-600 hover:text-green-800">Inspiration</a>
        <a href="#" class="text-gray-600 hover:text-green-800">Illustrations</a>
      </nav>

      <div class="hidden sm:flex items-center gap-3">
        <button
          class="hidden md:inline-block text-sm font-medium text-emerald-800 border border-emerald-800 rounded-md px-4 py-1.5 hover:bg-emerald-50 transition">
          Sign in
        </button>
        <button
          class="text-sm font-medium text-white bg-emerald-800 rounded-md px-4 py-1.5 hover:bg-emerald-900 transition">
          Start free trail
        </button>
      </div>
    </header>

  <main
    class="relative flex items-center justify-center min-h-[calc(100vh-4rem)] overflow-hidden bg-emerald-950 px-4 py-12">
    <img src="/UIdesign/faheem/image/backgroundlogin.svg" alt=""
      class="pointer-events-none absolute inset-0 h-full w-full object-cover opacity-90">

    <div
      class="pointer-events-none absolute inset-0 bg-[linear-gradient(120deg,transparent_40%,rgba(255,255,255,0.15)_50%,transparent_60%)] opacity-40">
    </div>

    <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl px-6 py-10 sm:px-10 sm:py-12">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 text-center">Sign in</h1>
      <p class="text-sm text-gray-500 text-center mt-2">
        New to DesignMe? <a href="#" class="text-emerald-800 font-semibold underline">Sign up for free</a>
      </p>

      <form class="mt-8 space-y-5">
        <div>
          <label for="email" class="block text-sm font-Poppins font-normal mb-1.5">Email address</label>
          <input id="email" type="email" placeholder=""
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent transition" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-sm font-Poppins font-normal">Password</label>
            <button type="button" id="toggle-password"
              class="flex items-center gap-1 text-xs text-gray-400 hover:text-gray-600">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path
                  d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a21.62 21.62 0 015.06-6.06M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a21.6 21.6 0 01-3.22 4.6M1 1l22 22" />
                <path d="M14.12 14.12a3 3 0 11-4.24-4.24" />
              </svg>
              <span>Hide</span>
            </button>
          </div>
          <input id="password" type="password" placeholder=""
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent transition" />
        </div>

        <div class="text-right">
          <a href="#" class="text-sm font-medium text-orange-500 underline hover:text-orange-600">Forget password?</a>
        </div>

        <button type="submit"
          class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg transition">
          Sign in
        </button>
      </form>

      <div class="flex items-center justify-center gap-3 mt-6">
        <button
          class="w-[80px] h-11 flex items-center justify-center rounded-full  border border-gray-200 hover:bg-gray-50 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.6 5.6 0 01-2.4 3.68v3h3.86c2.26-2.09 3.56-5.17 3.56-8.92z" />
            <path fill="#34A853"
              d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0012 24z" />
            <path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 010-4.56v-3.1H1.29a12 12 0 000 10.76l3.98-3.1z" />
            <path fill="#EA4335"
              d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.29 6.62l3.98 3.1C6.22 6.86 8.87 4.75 12 4.75z" />
          </svg>
        </button>
        <button
          class="w-[80px] h-11 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-50 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#000">
            <path
              d="M16.36 1.43c0 1.14-.42 2.2-1.24 3.03-.85.86-2.02 1.5-3.18 1.4-.13-1.1.44-2.25 1.23-3.03.83-.83 2.13-1.4 3.19-1.4zm3.62 15.7c-.35.8-.52 1.16-.97 1.87-.62 1-1.5 2.24-2.6 2.25-.97.01-1.22-.63-2.54-.62-1.32.01-1.6.63-2.57.62-1.1-.01-1.93-1.13-2.56-2.13C6.9 17.03 6 13.5 7.24 11.1c.62-1.2 1.72-1.95 2.9-1.97 1.04-.02 2.02.7 2.66.7.63 0 1.83-.86 3.08-.74.52.02 2 .21 2.95 1.58-.08.05-1.76 1.03-1.74 3.06.02 2.44 2.14 3.25 2.16 3.26-.02.05-.34 1.16-.27 1.14z" />
          </svg>
        </button>
        <button
          class="w-[80px] h-11 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-50 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1877F2">
            <path
              d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z" />
          </svg>
        </button>
        <button
          class="w-[80px] h-11 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-50 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1DA1F2">
            <path
              d="M23 4.9c-.85.38-1.76.63-2.72.75a4.75 4.75 0 002.08-2.62 9.5 9.5 0 01-3.01 1.15A4.74 4.74 0 0012.14 8.9 13.44 13.44 0 013.15 4.1a4.74 4.74 0 001.47 6.32 4.7 4.7 0 01-2.15-.6v.06a4.74 4.74 0 003.8 4.65 4.75 4.75 0 01-2.14.08 4.74 4.74 0 004.43 3.29A9.5 9.5 0 011 20.29a13.4 13.4 0 007.29 2.14c8.74 0 13.52-7.24 13.52-13.52 0-.21 0-.42-.02-.62A9.7 9.7 0 0023 4.9z" />
          </svg>
        </button>
      </div>
    </div>
  </main>

</body>

</html>
