<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExploreWander Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .comic-neue-light {
      font-family: "Comic Neue", cursive;
      font-weight: 300;
      font-style: normal;
    }

    .comic-neue-regular {
      font-family: "Comic Neue", cursive;
      font-weight: 400;
      font-style: normal;
    }

    .comic-neue-bold {
      font-family: "Comic Neue", cursive;
      font-weight: 700;
      font-style: normal;
    }

    .comic-neue-light-italic {
      font-family: "Comic Neue", cursive;
      font-weight: 300;
      font-style: italic;
    }

    .comic-neue-regular-italic {
      font-family: "Comic Neue", cursive;
      font-weight: 400;
      font-style: italic;
    }

    .comic-neue-bold-italic {
      font-family: "Comic Neue", cursive;
      font-weight: 700;
      font-style: italic;
    }
  </style>
</head>

<body class="min-h-screen">

  <header class="w-full bg-white border-b border-gray-100 relative z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <span class="font-bold italic text-gray-900 text-lg comic-neue-bold-italic">ExploreWander</span>

      <nav class="hidden lg:flex items-center gap-8 text-sm font-medium">
        <a href="#" class="text-gray-600 hover:text-green-800">Home</a>
        <a href="#" class="text-gray-600 hover:text-green-800">Flights</a>
        <a href="#" class="text-gray-600 hover:text-green-800">Hotels</a>
        <a href="#" class="text-gray-600 hover:text-green-800">About</a>
        <a href="#" class="text-gray-600 hover:text-green-800">Contact</a>
      </nav>

      <div class="hidden sm:flex items-center gap-4">
        <button class="hidden md:flex items-center gap-1 text-sm text-gray-700 hover:text-gray-900">
          English (united States)
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <button
          class="text-sm font-medium text-blue-600 border border-blue-600 rounded-md px-4 py-1.5 hover:bg-blue-50 transition">
          Sign in
        </button>
      </div>
  </header>

  <!-- Hero section -->
  <main class="relative flex items-center justify-center min-h-[calc(100vh-4rem)] overflow-hidden px-4 py-12">
    <img src="/UIdesign/faheem/image/backgroundlogin2.svg" alt=""
      class="pointer-events-none absolute inset-0 h-full w-full object-cover">

    <!-- Sign in card -->
    <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
        <p class="text-sm text-gray-900">
          <span class="font-semibold">Sign in</span>
          <span class="text-gray-400">or</span>
          <span class="font-semibold">join</span>
          <span class="text-gray-400">another way</span>
        </p>
        <button class="text-gray-400 hover:text-gray-600" aria-label="Close">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <button
        class="w-full flex items-center gap-3 px-6 py-4 border-b border-gray-100 hover:bg-gray-50 transition text-left">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.6 5.6 0 01-2.4 3.68v3h3.86c2.26-2.09 3.56-5.17 3.56-8.92z" />
          <path fill="#34A853"
            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0012 24z" />
          <path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 010-4.56v-3.1H1.29a12 12 0 000 10.76l3.98-3.1z" />
          <path fill="#EA4335"
            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.29 6.62l3.98 3.1C6.22 6.86 8.87 4.75 12 4.75z" />
        </svg>
        <span class="text-sm text-gray-800">Sign in to ExploreWander with Google</span>
      </button>

      <div class="px-6 pt-5 pb-6">
        <div class="flex items-center gap-3">
          <img src="/UIdesign/faheem/icon/login2.svg" alt="Bernard Walter" class="w-9 h-9 rounded-full flex-shrink-0">
          <div>
            <p class="text-sm font-medium text-gray-900">Bernard Walter</p>
            <p class="text-xs text-gray-500">bernardwalter@google.com</p>
          </div>
        </div>

        <button
          class="w-full mt-4 bg-[#5b7fe0] hover:bg-[#4c6fd1] text-white text-sm font-semibold py-2.5 rounded-lg transition">
          Continue as Bernard
        </button>

        <p class="text-xs text-gray-400 mt-4 leading-relaxed">
          To create your account, Google will share your name, email address, and profile picture with Design Community.
          Learn more about
          <a href="#" class="underline font-medium text-gray-500">Terms of Service</a> and
          <a href="#" class="underline font-medium text-gray-500">Privacy Policy.</a>
        </p>
      </div>
    </div>
  </main>

</body>

</html>
