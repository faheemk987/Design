<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Register</title>
  </head>
  <body class="min-h-screen bg-[#f1f1f1]">
    <div
      class="relative flex min-h-screen items-center justify-center overflow-hidden px-0 py-0 sm:px-6 sm:py-10 lg:px-8"
    >
      <img
        src="./image/signup2.jpg"
        alt="Background"
        class="absolute inset-0 hidden h-full w-full object-cover opacity-90 lg:block"
      />
      <!-- <div class="absolute inset-0 hidden bg-[#0f0f12]/40 lg:block"></div> -->

      <div
        class="relative w-full max-w-[510px] rounded-none bg-white px-5 py-6 sm:rounded-[28px] sm:px-8 sm:py-8 lg:rounded-[28px]"
      >
        <button
          type="button"
          aria-label="Close"
          class="absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full border border-[#ECECEC] bg-white text-xl font-light text-[#4a4a4a] shadow-sm transition hover:bg-slate-50"
        >
          ×
        </button>

        <div class="mx-auto flex flex-col items-center text-center">
          <div class="mb-5 flex items-center justify-center">
            <img src="./icons/logo.svg" alt="Logo" class="h-12 w-12" />
          </div>

          <h1
            class="max-w-[360px] text-[26px] font-semibold leading-[1.25] text-[#111214]"
          >
            Register to get free access to all our recourses
          </h1>

          <p class="mt-3 text-[14px] text-[#100F14] font-normal">
            Sign up to see more
          </p>

          <div class="mt-7 w-full space-y-4">
            <!-- space-y-4  = space kali ya use hota hai -->
            <button
              type="button"
              class="flex w-full items-center justify-center gap-2 rounded-full bg-[#100F14] px-4 py-3.5 text-sm font-medium text-white"
            >
              Continue with email
            </button>

            <button
              type="button"
              class="flex w-full items-center justify-center gap-3 rounded-full border border-[#9794AA] bg-white px-4 py-3.5 text-sm font-medium text-[#1b1c20]"
            >
              <img src="./icons/facebook.svg" alt="Facebook" class="h-5 w-5" />
              Continue with Facebook
            </button>

            <button
              type="button"
              class="flex w-full items-center justify-center gap-3 rounded-full border border-[#9794AA] bg-white px-4 py-3.5 text-sm font-medium text-[#1b1c20]"
            >
              <img src="./icons/google.svg" alt="Google" class="h-5 w-5" />
              Continue with Google
            </button>
          </div>

          <p
            class="mt-6 max-w-[330px] text-center text-[11px] leading-5 text-[#7a7c81]"
          >
            By continuing, you agree to our
            <span class="font-medium text-[#2d2f34] underline"
              >Terms of Service</span
            >and
            <span class="font-medium text-[#2d2f34] underline"
              >Privacy Policy</span
            >.
          </p>

          <p class="mt-4 text-sm text-[#5a5d63]">
            Already a member?
            <a href="#" class="font-semibold text-[#111214] underline"
              >Log in</a
            >
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
