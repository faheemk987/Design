    <style>

      body {

        background-image: url("./assets/flowers.jpg");
        background-repeat: no-repeat;

  <body class="w-full h-full">
    <header class="w-full h-[60px] flex justify-between bg-white">

      </div>


      
      <div class="flex items-center w-[500px] justify-center gap-[20px]">
        <div class="flex items-center gap-[10px]">
          <svg
            width="15"
            height="15"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M1 6.83333C1 10.055 3.61167 12.6667 6.83333 12.6667C10.055 12.6667 12.6667 10.055 12.6667 6.83333C12.6667 3.61167 10.055 1 6.83333 1C3.61167 1 1 3.61167 1 6.83333ZM6.83333 13.6667C3.05939 13.6667 0 10.6073 0 6.83333C0 3.05939 3.05939 0 6.83333 0C10.6073 0 13.6667 3.05939 13.6667 6.83333C13.6667 8.54033 13.0407 10.1011 12.0059 11.2988L14.1869 13.4798C14.3821 13.6751 14.3821 13.9916 14.1869 14.1869C13.9916 14.3821 13.6751 14.3821 13.4798 14.1869L11.2988 12.0059C10.1011 13.0407 8.54033 13.6667 6.83333 13.6667Z"
              fill="#313039"
            />
          </svg>

          <input
            type="search"
            placeholder="Search"
            class="h-[40px] w-[100px]"
          />
        </div>
        <select name="" id="" class="h-[40px] w-[200px] ">
          <option value="">English (united States)</option>
          <option value="">Pashto</option>
          <option value="">siraiki</option>
          <option value="">sahiwali</option>
        </select>
        <button
          class="bg-[#080300] w-[100px] text-[#FFFFFF] rounded-[8px] h-[40px]"
        >
          Sign up
        </button>
      </div>
    </header>

    <div
      class="w-[100%] h-[500px] gap-[30px] flex flex-col items-center justify-center"
    >
      <h1 class="text-white text-[50px] font-medium">
        Every Bloom Tells a Story
      </h1>
      <p class="text-white max-w-[500px] text-center">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quas facere
        eius aperiam inventore, porro odio recusandae quae minus architecto
        sapiente temporibus veniam delectus sed quaerat itaque officia
        voluptatibus id qui.
      </p>
      <button
        class="rounded-[16px] bg-[#FCFCFC] text-[#120A28] w-[200px] h-[50px]"
      >
        Explore Flowers
      </button>
    </div>
