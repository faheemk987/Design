<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#12141d] min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans antialiased">

    <!-- Main Container / Card -->
    <div
        class="w-full max-w-[1000px] lg:h-[640px] bg-[#1a1d27] rounded-[28px] p-3 sm:p-4 flex flex-col lg:flex-row gap-4 overflow-hidden shadow-2xl border border-white/5">

        <!-- Left Side: Login Form -->
        <div class="w-full lg:w-1/2 flex flex-col justify-between px-3 sm:px-5 lg:px-8 py-5 sm:py-6 text-white">


            <div class="flex items-center gap-2">

                <img src="./images/Brand Logo (1).svg" alt="">

            </div>

            <!-- Header -->
            <div class="mt-2">
                <h1 class="text-3xl text-white flex items-center gap-2">
                    Welcome back <span class="text-2xl">👋</span>
                </h1>
                <p class="text-gray-400 text-xs mt-1.5">We are happy to have you back</p>
            </div>

            <!-- Form Inputs -->
            <form class="space-y-4 my-auto" onsubmit="event.preventDefault();">
                <!-- Email Input -->
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">Email Address*</label>
                    <input type="email" placeholder="Enter your email address"
                        class="w-full bg-[#222634] border border-gray-700/60 rounded-xl px-4 py-3 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" />
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" placeholder="Enter your password"
                            class="w-full bg-[#222634] border border-gray-700/60 rounded-xl px-4 py-3 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all pr-10" />
                        <button type="button"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200">
                            <i data-lucide="eye-off" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Terms & Conditions Checkbox -->
                <div class="flex items-center gap-2.5 pt-1">
                    <input type="checkbox" id="terms"
                        class="w-4 h-4 rounded border-gray-700 bg-[#222634] text-indigo-600 focus:ring-0 focus:ring-offset-0 cursor-pointer"
                        checked />
                    <label for="terms" class="text-xs text-gray-300 select-none cursor-pointer">
                        I agree to terms & conditions
                    </label>
                </div>

                <!-- Login Button -->
                <button type="submit"
                    class="w-full bg-[#6366f1] hover:bg-[#5457cd] text-white font-medium py-3 rounded-xl text-sm transition-all shadow-lg shadow-indigo-500/20 mt-2">
                    Login
                </button>

                <!-- Or Divider -->
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-800"></div>
                    <span class="flex-shrink mx-3 text-gray-500 text-[11px]">Or</span>
                    <div class="flex-grow border-t border-gray-800"></div>
                </div>

                <!-- Google Login Button -->
                <button type="button"
                    class="w-full bg-[#222634] hover:bg-[#282d3d] border border-gray-700/50 text-gray-200 font-medium py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>Login with Google</span>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="text-xs text-gray-400">
                Don't have an account? <a href="#"
                    class="text-white font-semibold underline underline-offset-2 hover:text-indigo-400 transition-colors">Register</a>
            </div>

        </div>

        <!-- Right Side: 3D Art Card -->
        <div class="hidden sm:block w-full lg:w-1/2 h-48 sm:h-64 lg:h-full shrink-0 rounded-[24px] bg-cover bg-center overflow-hidden"
            style="background-image: url('../farman/images/right.png');">
            <div class="w-full h-full bg-indigo-900/10 backdrop-contrast-125"></div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
