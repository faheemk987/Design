<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore the world with us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .page-background {
            background-image:
                linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.35) 100%),
                url('./images/backdrop.jpg');
        }

        @media (max-width: 1023px) {
            .page-background {
                background-image: none;
            }
        }
    </style>
</head>

<body class="m-0 min-h-dvh font-sans">

    <!-- Full-screen Background (edge-to-edge, no rounding) -->
    <div
        class="page-background relative min-h-dvh w-full bg-[#1e1e1e] bg-cover bg-center flex items-center justify-center p-3 sm:p-6 lg:p-10">

        <!-- Login Card -->
        <div
            class="relative bg-white/95 backdrop-blur-md rounded-[20px] p-3.5 sm:p-5 flex flex-col justify-between gap-3.5 shadow-2xl w-full max-w-[340px] lg:max-w-[360px] max-h-[calc(100dvh-1.5rem)] sm:max-h-[calc(100dvh-3rem)] overflow-y-auto">
            <!-- Close Icon -->
            <div class="flex justify-end -mb-2">
                <button type="button" aria-label="Close" class="text-gray-400 hover:text-gray-700 transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Header -->
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-900 tracking-tight">Explore the world with us</h2>
            </div>

            <!-- Social Logins -->
            <div class="space-y-2.5 w-full">
                <!-- Facebook -->
                <button type="button"
                    class="w-full flex items-center justify-center gap-2.5 border border-gray-300 rounded-full py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                    <i data-lucide="facebook" class="w-4 h-4 text-blue-600"></i>
                    <span>Continue with Facebook</span>
                </button>

                <!-- Google -->
                <button type="button"
                    class="w-full flex items-center justify-center gap-2.5 border border-gray-300 rounded-full py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>Continue with Google</span>
                </button>

                <!-- Apple -->
                <button type="button"
                    class="w-full flex items-center justify-center gap-2.5 border border-gray-300 rounded-full py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                    <i data-lucide="apple" class="w-4 h-4 text-black"></i>
                    <span>Continue with Apple</span>
                </button>
            </div>

            <!-- Email Field -->
            <div class="w-full">
                <div class="relative flex py-1.5 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-3 text-gray-400 text-xs">or</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <div class="mt-1.5">
                    <label for="email" class="block text-xs font-medium text-gray-500 mb-1">Email</label>
                    <input id="email" type="email" placeholder="Enter your email"
                        class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>

                <button type="button"
                    class="mt-2.5 w-full bg-gray-900 text-white text-sm font-medium py-2 rounded-full hover:bg-gray-800 transition">
                    Continue
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
