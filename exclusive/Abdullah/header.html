<header class="w-full h-[100px] flex flex-col gap-4">
      <div class="w-full text-[white] bg-[#000000] flex gap-4 items-center">
        <div class="w-[30%] h-[30px]"></div>
        <div
          class="w-[40%] h-[30px] text-[10px] flex items-center justify-center gap-4"
        >
          <p>
            Summer Sale For All Swim Suits And Free Express Delivery - OFF 50%!
          </p>
          <button><a href="#">Shop Now</a></button>
        </div>
        <div
          class="w-[30%] h-[30px] text-[12px] flex items-center justify-center"
        >
          <select name="language" id="language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
          </select>
        </div>
      </div>
      <div class="second-div w-full flex items-center justify-between h-[60px]">
        <div class="w-[30%] h-[60px] flex items-center justify-center">
          <h1 class="text-[25px] font-bold">Exclusive</h1>
        </div>
        <div class="w-[35%] h-[60px] flex items-center justify-center gap-4">
          <ul class="flex gap-[30px] text-[16px]">
            <li>Home</li>
            <li>Contact</li>
            <li>About</li>
            <li>Sign Up</li>
          </ul>
        </div>
        <div
          class="h-[60px] flex items-center justify-center gap-[20px] w-[35%] "
        >
          <div class="flex justify-center items-center h-[60px]">
            <input
              type="search"
              class="text-[10px]"
              placeholder="What are you looking for?"
            />
            <i class="fa-solid fa-magnifying-glass text-[20px] font-thin  "></i>
          </div>
          <i class="fa-solid fa-heart text-[20px]"></i>
          <i class="fa-solid fa-cart-shopping text-[20px]"></i>
        </div>
      </div>
    </header>
