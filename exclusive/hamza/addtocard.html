<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
    <title>Shopping Cart | Exclusive</title>
  </head>
  <body class="min-h-screen bg-white font-['DM_Sans'] text-[#171717]">
    <main
      class="mx-auto max-w-[1100px] px-5 pb-20 pt-10 sm:px-8 lg:px-10 lg:pt-16"
    >
      <section class="text-[#082b52]">
        <div
          class="grid grid-cols-[minmax(220px,1fr)_150px_170px_150px] border-b border-[#9aaabd] px-0 pb-5 text-[16px] font-bold sm:px-0"
        >
          <span>Product</span><span>Price</span><span>Quantity</span
          ><span>Subtotal</span>
        </div>
        <div
          class="grid grid-cols-[minmax(220px,1fr)_150px_170px_150px] items-center border-b border-[#edf0f2] py-7"
        >
          <div class="flex items-center gap-3">
            <div
              class="relative flex h-12 w-12 items-center justify-center rounded bg-[#f3f3f3]"
            >
              <img
                src="image/king.png"
                alt="LCD "
                class="h-full w-full object-contain"
              /><button
                type="button"
                class="absolute -left-2 -top-2 flex h-4 w-4 items-center justify-center rounded-full bg-[#ff2d3d] text-[12px] text-white"
              >
                ×
              </button>
            </div>
            <span class="text-[16px]">LCD Monitor</span>
          </div>
          <span class="text-[15px]">$650</span>
          <div
            class="flex h-[42px] w-20 items-center justify-between rounded border border-[#9aaabd] text-[15px]"
          >
            <span class="pl-3">01</span
            ><span class="flex h-full flex-col border-l border-[#cbd5e1]"
              ><button
                type="button"
                class="h-1/2 px-2 text-[11px] hover:bg-[#f1f3f5]"
              >
                ⌃</button
              ><button
                type="button"
                class="h-1/2 border-t border-[#cbd5e1] px-2 text-[11px] leading-none hover:bg-[#f1f3f5]"
              >
                ⌄
              </button></span
            >
          </div>
          <span class="text-[15px]">$650</span>
        </div>
        <div
          class="grid grid-cols-[minmax(220px,1fr)_150px_170px_150px] items-center border-b border-[#edf0f2] py-7"
        >
          <div class="flex items-center gap-3">
            <div
              class="relative flex h-12 w-12 items-center justify-center rounded bg-[#f3f3f3]"
            >
              <img
                src="image/game.png"
                alt="H1 Gamepad"
                class="h-full w-full object-contain"
              /><button
                type="button"
                class="absolute -left-2 -top-2 flex h-4 w-4 items-center justify-center rounded-full bg-[#ff2d3d] text-[12px] leading-none text-white"
              >
                ×
              </button>
            </div>
            <span class="text-[16px]">H1 Gamepad</span>
          </div>
          <span class="text-[15px]">$550</span>
          <div
            class="flex h-[42px] w-20 items-center justify-between rounded border border-[#9aaabd] text-[15px]"
          >
            <span class="pl-3">02</span
            ><span class="flex h-full flex-col border-l border-[#cbd5e1]"
              ><button
                type="button"
                class="h-1/2 px-2 text-[11px] leading-none hover:bg-[#f1f3f5]"
              >
                ⌃</button
              ><button
                type="button"
                class="h-1/2 border-t border-[#cbd5e1] px-2 text-[11px] hover:bg-[#f1f3f5]"
              >
                ⌄
              </button></span
            >
          </div>
          <span class="text-[15px]">$1100</span>
        </div>
        <div
          class="flex flex-col justify-between gap-8 py-8 sm:flex-row sm:items-center"
        >
          <button
            type="button"
            class="rounded border border-[#9aaabd] px-6 py-4 text-[16px] font-bold text-[#000000] transition hover:bg-[#183653] hover:text-white"
          >
            Return To Shop</button
          ><button
            type="button"
            class="rounded border border-[#9aaabd] px-6 py-4 text-[16px] text-[#000000] transition hover:bg-[#f6f8fa]"
          >
            Update Cart
          </button>
        </div>
        <div class="grid items-start gap-10 lg:grid-cols-[1fr_496px]">
          <div class="flex w-full max-w-[365px]">
            <input
              type="text"
              placeholder="Coupon Code"
              aria-label="Coupon Code"
              class="h-[50px] min-w-0 flex-1 rounded-l border border-[#9aaabd] px-4 text-[14px] outline-none placeholder:text-[#8694a4] focus:border-[#183653]"
            /><button
              type="button"
              class="h-[50px] rounded-r bg-[#DB4444] px-6 text-[14px] text-white transition hover:bg-[#e52232]"
            >
              Apply Coupon
            </button>
          </div>
          <div class="rounded-lg border border-[#9aaabd] p-6 sm:p-8">
            <h2
              class="mb-6 font-['Space_Grotesk'] text-[18px] font-bold text-[#111827]"
            >
              Cart Total
            </h2>
            <div class="text-[15px]">
              <div class="flex justify-between border-b border-[#000000] pb-4">
                <span>Subtotal:</span><span>$1750</span>
              </div>
              <div class="flex justify-between border-b border-[#000000] py-4">
                <span>Shipping:</span><span>Free</span>
              </div>
              <div class="flex justify-between pt-7 font-bold text-[#111827]">
                <span>Total:</span><span>$1750</span>
              </div>
            </div>
            <button
              type="button"
              class="mt-7 w-full rounded bg-[#DB4444] py-4 text-[14px] text-white transition hover:bg-[#e52232]"
            >
              Process to checkout
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
