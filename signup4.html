<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-tr from-purple-700 via-pink-400 to-amber-200 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Main Card Container -->
    <div class="relative bg-white/80 backdrop-blur-md rounded-3xl p-8 md:p-10 w-full max-w-md min-h-auto shadow-2xl flex flex-col items-center text-center"
        style="height: 600px; max-width: 550px;">

        <!-- Close Button -->
        <button
            class="absolute -top-3 -right-3 sm:top-2 sm:right-2 bg-white/90 hover:bg-white text-gray-600 rounded-full w-8 h-8 flex items-center justify-center shadow-md transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Logo -->
        <div class="mb-4">
            <svg width="37" height="49" viewBox="0 0 37 49" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M37 37L37 18.5C37 8.28274 28.7173 1.41726e-05 18.5 1.28328e-05C8.28274 1.1493e-05 1.13952e-05 8.28274 1.00554e-05 18.5L7.62939e-06 37L37 37Z"
                    fill="#6938EF" />
                <path
                    d="M7.78921 37C7.78921 30.9055 12.7298 25.9649 18.8243 25.9649C24.9188 25.9649 29.8594 30.9055 29.8594 37L7.78921 37Z"
                    fill="#F0276C" />
                <path
                    d="M7.78921 37C7.78921 43.0945 12.7298 48.0351 18.8243 48.0351C24.9188 48.0351 29.8594 43.0945 29.8594 37L7.78921 37Z"
                    fill="#EDB500" />
                <path
                    d="M18.5 22.0702C21.5473 22.0702 24.0176 19.5999 24.0176 16.5526C24.0176 13.5054 21.5473 11.0351 18.5 11.0351C15.4528 11.0351 12.9825 13.5054 12.9825 16.5526C12.9825 19.5999 15.4528 22.0702 18.5 22.0702Z"
                    fill="#FAFAFF" />
            </svg>
        </div>

        <!-- Title & Subtitle -->
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Create an account</h1>
        <p class="text-xs text-gray-500 mb-6">
            Already have an account?
            <a href="#" class="font-semibold text-gray-800 underline hover:text-black">Log in</a>
        </p>

        <!-- Social Buttons -->
        <div class="w-full space-y-3 mb-6">
            <!-- Facebook Button -->
            <button
                class="w-full border border-gray-300 hover:border-gray-400 rounded-full py-2.5 px-4 flex items-center justify-center gap-2 text-sm font-medium text-gray-700 hover:bg-gray-50/50 transition-all">
                <svg class="w-5 h-5 text-blue-600 fill-current" viewBox="0 0 24 24">
                    <path
                        d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                </svg>
                <span>Continue with Facebook</span>
            </button>

            <!-- Google Button -->
            <button
                class="w-full border border-gray-300 hover:border-gray-400 rounded-full py-2.5 px-4 flex items-center justify-center gap-2 text-sm font-medium text-gray-700 hover:bg-gray-50/50 transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                    <path fill="#34A853"
                        d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.26v3.15C3.25 21.3 7.31 24 12 24z" />
                    <path fill="#FBBC05"
                        d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.26C.46 8.23 0 10.06 0 12s.46 3.77 1.26 5.39l4.02-3.15z" />
                    <path fill="#EA4335"
                        d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.61l4.02 3.15c.95-2.85 3.6-4.96 6.72-4.96z" />
                </svg>
                <span>Continue with Google</span>
            </button>
        </div>

        <!-- Divider -->
        <div class="relative w-full flex items-center justify-center mb-6">
            <span class="text-xs text-gray-400 bg-transparent px-2 z-10">Or</span>
        </div>

        <!-- Email Form Section -->
        <div class="w-full text-left">
            <label class="block text-xs font-medium text-gray-600 mb-2">
                Enter your email address to create an account.
            </label>
            <input type="email" placeholder="Your email"
                class="w-full border-b border-gray-300 focus:border-gray-800 bg-transparent py-2 text-sm text-gray-800 placeholder-gray-400 focus:outline-none transition-colors" />
        </div>

    </div>

</body>

</html>
