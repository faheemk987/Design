<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an Account</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-purple-700 via-pink-400 to-amber-200 min-h-screen flex items-center justify-center p-4 font-sans">

<!-- Main Card Container -->
<div class="relative bg-white/80 backdrop-blur-md rounded-3xl p-8 md:p-10 w-full max-full max-w-md shadow-2xl flex flex-col items-center text-center">

<!-- Close Button -->
<button class="absolute -top-3 -right-3 sm:top-2 sm:right-2 bg-white/90 hover:bg-white text-gray-600 rounded-full w-8 h-8 flex items-center justify-center shadow-md transition-all">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
</svg>
</button>

<!-- Logo Placeholder -->
<div class="mb-4">
<div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center relative overflow-hidden shadow">
<div class="w-4 h-4 bg-orange-500 rounded-full absolute bottom-0"></div>
<div class="w-2 h-2 bg-white rounded-full z-10 mb-2"></div>
</div>
</div>

<!-- Title & Subtitle -->
<h1 class="text-2xl font-bold text-gray-900 mb-1">Create an account</h1>
<p class="text-xs text-gray-500 mb-6">
Already have an account?
<a href="#" class="font-semibold text-gray-800 underline hover:text-black">Log in</a>
</p>

<!-- Social Buttons -->
<div class="w-full space-y-3 mb-6">
<!-- Facebook Button -->
<button class="w-full border border-gray-300 hover:border-gray-400 rounded-full py-2.5 px-4 flex items-center justify-center gap-2 text-sm font-medium text-gray-700 hover:bg-gray-50/50 transition-all">
<svg class="w-5 h-5 text-blue-600 fill-current" viewBox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
</svg>
<span>Continue with Facebook</span>
</button>

<!-- Google Button -->
<button class="w-full border border-gray-300 hover:border-gray-400 rounded-full py-2.5 px-4 flex items-center justify-center gap-2 text-sm font-medium text-gray-700 hover:bg-gray-50/50 transition-all">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
<path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.26v3.15C3.25 21.3 7.31 24 12 24z"/>
<path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.26C.46 8.23 0 10.06 0 12s.46 3.77 1.26 5.39l4.02-3.15z"/>
<path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.61l4.02 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
</svg>
<span>Continue with Google</span>
</button>
</div>

<!-- Divider -->
<div class="relative w-full flex items-center justify-center mb-6">
<span class="text-xs text-gray-400 bg-transparent px-2 z-10">Or</span>
</div>

<!-- Email Form Section -->
<div class="w-full text-left">
<label class="block text-xs font-medium text-gray-600 mb-2">
Enter your email address to create an account.
</label>
<input
type="email"
placeholder="Your email"
class="w-full border-b border-gray-300 focus:border-gray-800 bg-transparent py-2 text-sm text-gray-800 placeholder-gray-400 focus:outline-none transition-colors"
/>
</div>

</div>

</body>
</html>
