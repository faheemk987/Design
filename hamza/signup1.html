<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Sign Up</title>
    <!-- <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      .glass {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style> -->
  </head>
  <body
    class="bg-[#19181F] text-white min-h-screen flex items-center justify-center p-4 sm:p-8"
  >
    <div class="w-full overflow-hidden rounded-[30px]">
      <div class="flex flex-col lg:flex-row gap-[200px]">
        <div
          class="flex w-full items-center justify-center px-6 py-10 sm:px-10 lg:w-[60%] lg:px-12"
        >
          <div class="w-full max-w-md">
            <div class="mb-8 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <svg
                  width="37"
                  height="49"
                  viewBox="0 0 37 49"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M37 37L37 18.5C37 8.28274 28.7173 1.41726e-05 18.5 1.28328e-05C8.28274 1.1493e-05 1.13952e-05 8.28274 1.00554e-05 18.5L7.62939e-06 37L37 37Z"
                    fill="#7A5AF8"
                  />
                  <path
                    d="M7.78945 37C7.78945 30.9055 12.73 25.9649 18.8245 25.9649C24.919 25.9649 29.8596 30.9055 29.8596 37L7.78945 37Z"
                    fill="#FE3278"
                  />
                  <path
                    d="M7.78945 37C7.78945 43.0945 12.73 48.0351 18.8245 48.0351C24.919 48.0351 29.8596 43.0945 29.8596 37L7.78945 37Z"
                    fill="#FCD451"
                  />
                  <path
                    d="M18.5 22.0702C21.5472 22.0702 24.0175 19.5999 24.0175 16.5526C24.0175 13.5054 21.5472 11.0351 18.5 11.0351C15.4527 11.0351 12.9824 13.5054 12.9824 16.5526C12.9824 19.5999 15.4527 22.0702 18.5 22.0702Z"
                    fill="#FAFAFF"
                  />
                </svg>

                <!-- <div
                  class="flex h-10 w-10 items-center justify-center rounded-full bg-[#7A5AF8] text-lg font-bold text-white shadow-[0_8px_20px_rgba(122,90,248,0.5)]"
                >
                  N
                </div>
                <span class="text-lg font-semibold tracking-wide text-white/90"
                  >Nova</span
                > -->
                <h1 class="text-[20px] font-semibold text-white">logo</h1>
              </div>
            </div>

            <div class="mb-8">
              <p
                class="mb-2 text-sm font-medium uppercase tracking-[0.22em] text-[#A7A0C4]"
              >
                WELCOME
              </p>
              <h1 class="text-4xl font-bold tracking-tight text-white">
                Create account
              </h1>
            </div>

            <form class="space-y-5">
              <div>
                <label
                  for="name"
                  class="mb-2 block text-sm font-medium text-white/80"
                  >Full name</label
                >
                <input
                  id="name"
                  type="text"
                  placeholder="Enter your name"
                  class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3.5 text-base text-white placeholder:text-white/35 outline-none transition focus:border-[#7A5AF8] focus:ring-2 focus:ring-[#7A5AF8]/30"
                />
              </div>

              <div>
                <label
                  for="email"
                  class="mb-2 block text-sm font-medium text-white/80"
                  >Email</label
                >
                <input
                  id="email"
                  type="email"
                  placeholder="name@example.com"
                  class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3.5 text-base text-white placeholder:text-white/35 outline-none transition focus:border-[#7A5AF8] focus:ring-2 focus:ring-[#7A5AF8]/30"
                />
              </div>

              <div>
                <label
                  for="password"
                  class="mb-2 block text-sm font-medium text-white/80"
                  >Password</label
                >
                <input
                  id="password"
                  type="password"
                  placeholder="••••••••••"
                  class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3.5 text-base text-white placeholder:text-white/35 outline-none transition focus:border-[#7A5AF8] focus:ring-2 focus:ring-[#7A5AF8]/30"
                />
              </div>

              <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-white/70">
                  <input
                    type="checkbox"
                    class="h-4 w-4 rounded border-white/20 bg-white/5 accent-[#7A5AF8]"
                  />
                  Remember me
                </label>
                <a href="#" class="text-[#7A5AF8] hover:text-[#9b7cff]"
                  >Forgot password?</a
                >
              </div>

              <button
                type="submit"
                class="mt-2 w-full rounded-2xl bg-[#7A5AF8] px-4 py-3.5 text-base font-semibold text-white shadow-[0_18px_30px_rgba(122,90,248,0.45)] transition hover:bg-[#6b4ce5]"
              >
                Sign up
              </button>
            </form>

            <div class="mt-7 flex items-center gap-4 text-sm text-white/50">
              <div class="h-px flex-1 bg-white/10"></div>
              <span>or continue with</span>
              <div class="h-px flex-1 bg-white/10"></div>
            </div>

            <div class="mt-6 flex gap-3">
              <button
                class="flex flex-1 items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-medium text-white/80 transition hover:bg-white/10"
              >
                <span class="text-base">G</span>
                Google
              </button>
              <button
                class="flex flex-1 items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-medium text-white/80 transition hover:bg-white/10"
              >
                <i class="fa-brands fa-facebook"></i>
              </button>
            </div>

            <p class="mt-7 text-center text-sm text-white/60">
              Already have an account?
              <a
                href="#"
                class="ml-1 font-semibold text-[#7A5AF8] hover:text-[#9b7cff]"
                >Sign in</a
              >
            </p>
          </div>
        </div>

        <div class="relative lg:w-[1200px] min-h-[840px] overflow-hidden">
          <img
            src="image/signup1.jpg"
            alt="Decorative sign-up illustration"
            class="absolute inset-0 h-full w-[100%] object-cover opacity-100"
          />
          <!-- <div class="absolute inset-x-0 bottom-0 h-36"></div> -->
        </div>
      </div>
    </div>
  </body>
</html>
